name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  check:
    name: Structure and pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate project layout
        run: |
          set -euo pipefail
          test -f FuckMPlayer.sln
          test -f FuckMPlayer.vcxproj
          test -f VERSION
          test -f pack.sh
          test -d main
          test -d plugin
          test -d frame
          test -d common
          test -d fuck
          test -d msvc-overlays
          test -d ex/logger
          test -f scripts/ci-msbuild.ps1
          test -f scripts/ci-stage-runtime.ps1
          test -f scripts/ci-screenshot.ps1
          test -f msvc-overlays/opengl/lib/glaux.lib
          test -f msvc-overlays/opengl/include/glaux.h
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "${VERSION}"
          echo "VERSION=${VERSION}"

      - name: Package runtime snapshot
        run: |
          chmod +x ./pack.sh
          ./pack.sh
          test -f pack.zip
          ls -lh pack/*.zip pack.zip

  windows-build:
    name: MSBuild Release Win32
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch third-party deps + apply MSVC overlays
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/fetch-deps.sh
          ./scripts/fetch-deps.sh
          test -d boost/boost
          test -f boost/boost.vcxproj
          test -f protobuf-2.4.1/vsprojects/libprotobuf.vcxproj
          test -f zeromq-2.1.7/builds/msvc/libzmq/libzmq.vcxproj
          test -f CEGUI-0.7.5/projects/premake/BaseSystem/CEGUIBase.vcxproj
          test -f wxWidgets-2.9.1/build/msw/wx_base.vcxproj
          test -f opengl/include/glaux.h
          test -f opengl/lib/glaux.lib
          test -f opengl/lib/freeglut.lib
          test -f CEGUI-0.7.5/dependencies/bin/d3dx9_43.dll

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $msb = (Get-Command msbuild).Source
          echo "MSBUILD_PATH=$msb" >> $env:GITHUB_ENV
          msbuild -version

      - name: MSBuild FuckMPlayer.sln (Release|Win32)
        shell: pwsh
        run: |
          ./scripts/ci-msbuild.ps1

      - name: Stage runnable fuck/ tree
        shell: pwsh
        run: |
          ./scripts/ci-stage-runtime.ps1

      - name: Screenshot player shell (best-effort)
        shell: pwsh
        continue-on-error: true
        run: |
          ./scripts/ci-screenshot.ps1

      - name: Upload build outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: win32-release-binaries
          path: |
            lib/Release/**
            **/Release/*.exe
            **/Release/*.dll
            fuck/*.exe
            fuck/*.dll
          if-no-files-found: warn

      - name: Upload player screenshot + diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-shell-screenshot
          path: |
            ci-artifacts/**
            docs/player-shell.png
          if-no-files-found: warn
